name: Verificações do projeto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ''
      OMR_REMOTE_URL: ''
      STORAGE_MODE: local
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHON_EXECUTABLE: ${{ github.workspace }}/venv/bin/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Instalar ferramentas de PDFs e fontes para os cartões de teste
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils fonts-liberation2 fonts-dejavu-core
      - name: Instalar dependências
        run: |
          npm ci
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r python/requirements.txt
      - name: Compilar NestJS e Next.js
        run: npm run build
      - name: Verificar tipos TypeScript
        run: npm run typecheck
      - name: Executar testes da API e do OpenCV
        run: npm test
      - name: Validar schema PostgreSQL e isolamento dos papéis públicos
        run: node scripts/test-postgres-schema.mjs
      - name: Reproduzir ensaio com imagens sintéticas e situações distintas
        run: venv/bin/python python/tests/benchmark.py artifacts/ci-benchmark
