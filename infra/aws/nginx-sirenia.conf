# Instalar SOMENTE após inspecionar o proxy do servidor e emitir o certificado.
# O upstream fica no loopback; PostgreSQL, Auth e Nest não têm portas públicas.
server {
    listen 443 ssl;
    server_name sirenia.morea-ifs.org;
    ssl_certificate /etc/letsencrypt/live/sirenia.morea-ifs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sirenia.morea-ifs.org/privkey.pem;
    client_max_body_size 1g;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
}
server {
    listen 80;
    server_name sirenia.morea-ifs.org;
    return 301 https://$host$request_uri;
}
